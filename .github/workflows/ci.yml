name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block live clump configs
        run: |
          set -euo pipefail
          bad=$(git ls-files '**/config.json' | grep -v 'manifest.json' || true)
          if [ -n "$bad" ]; then
            echo "Tracked config.json files are not allowed:"
            echo "$bad"
            exit 1
          fi
      - name: Block .env except examples
        run: |
          set -euo pipefail
          bad=$(git ls-files '**/.env' | grep -v '.env.example' || true)
          if [ -n "$bad" ]; then
            echo "Tracked .env files are not allowed:"
            echo "$bad"
            exit 1
          fi
      - name: Block RFC1918 10.0.0.x in tracked files
        run: |
          set -euo pipefail
          if git grep -nE '10\.0\.0\.[0-9]+' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo "Found 10.0.0.x addresses; use 192.0.2.x (RFC 5737) in public examples."
            exit 1
          fi

  # Colocated *.test.mjs also run from the hdc repo CI (vitest include hdc-clumps/**).
  # This job re-runs them against the PR's hdc-clumps tree for package-only PRs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hdc-clumps
      - uses: actions/checkout@v4
        with:
          repository: dukk/hdc
          path: hdc
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hdc/package-lock.json
      - name: Run colocated package unit tests
        working-directory: hdc
        run: |
          set -euo pipefail
          npm ci
          npx vitest run ../hdc-clumps
